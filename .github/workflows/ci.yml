name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install ruff + mypy
        run: pip install ruff mypy
      - name: ruff check
        run: ruff check src/ tests/
      - name: ruff format check
        run: ruff format --check src/ tests/
      - name: mypy
        run: mypy src/rtpfb || true   # soft-fail while typing is iterating

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,preset]"
      - name: pytest
        env:
          RTPFB_LOG_LEVEL: WARNING
        run: pytest -v -m "not gpu and not audio and not camera and not integration"
