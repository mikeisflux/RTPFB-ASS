[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtpfb-ass"
version = "0.1.0"
description = "Real-Time Photorealistic Full-Body Avatar Streaming System"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mikeisflux" }]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "mediapipe>=0.10",
    "insightface>=0.7",
    "onnx>=1.14",
    "onnxruntime-gpu>=1.16; sys_platform != 'darwin'",
    "onnxruntime>=1.16; sys_platform == 'darwin'",
    "pyvirtualcam>=0.11",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
lipsync = [
    "torch>=2.1",
    "librosa>=0.10",
    "scipy>=1.10",
]
body = [
    "torch>=2.1",
    "diffusers>=0.27",
    "transformers>=4.40",
    "accelerate>=0.30",
]
voice = [
    "torch>=2.1",
    "websocket-client>=1.6",
    "soundfile>=0.12",
]
mocap = [
    "python-osc>=1.8",
]
preset = [
    "PyYAML>=6.0",
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "PyYAML>=6.0",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.5",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "PyYAML>=6.0",
]

[project.scripts]
rtpfb = "rtpfb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rtpfb"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/rtpfb/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function-call in default argument; we use it intentionally
    "SIM108", # ternary expressions hurt readability for non-trivial branches
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["B", "SIM"]
"src/rtpfb/_vendor/**/*" = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["src/rtpfb/_vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU",
    "audio: requires audio device",
    "camera: requires webcam",
    "integration: requires real models / network",
]
