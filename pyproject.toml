[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtpfb-ass"
version = "0.1.0"
description = "Real-Time Photorealistic Full-Body Avatar Streaming System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "mediapipe>=0.10",
    "insightface>=0.7",
    "onnx>=1.14",
    "onnxruntime-gpu>=1.16; sys_platform != 'darwin'",
    "onnxruntime>=1.16; sys_platform == 'darwin'",
    "pyvirtualcam>=0.11",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
lipsync = [
    "torch>=2.1",
    "librosa>=0.10",
]
body = [
    "torch>=2.1",
    "diffusers>=0.27",
    "transformers>=4.40",
    "accelerate>=0.30",
]

[project.scripts]
rtpfb = "rtpfb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rtpfb"]
