# Voice-only preset: no virtual camera, just real-time voice conversion to a
# loopback mic. Useful for streaming the voice without a face avatar (or while
# debugging the audio path).
#
# Usage:
#   rtpfb run --preset presets/voice-only.yaml --target ./assets/face.png --voice-model alice

enable_pose: false
enable_voice: true
enable_lipsync: false
enable_body: false
enable_stabilize: false

output_virtual_camera: false
output_virtual_mic: true

# Windows WASAPI shared mode rejects arbitrary sample rates; 48 kHz matches
# the system default and most realtime voice models (incl. RVC v2 at 48k).
# 1024 samples = ~21 ms per block - small enough for low latency, big
# enough to avoid underruns on Windows.
audio_samplerate: 48000
audio_blocksize: 1024
voice_backend: auto
